<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos de dados</title>
  </head>
  <body>
    <script>
      const name = "Alexandre"; //string
      const age = 47; // number
      const active = false; // boolean
      const vote = null; // object
      const contain = undefined; //undefined

      // Até aqui estamos mostrando apenas o tipo de dados, abaixo, temos no console log a apresentação do dado, e logo abaixo o tipo de dado (string, number, boolean, object and undefined)

      console.log(name);
      console.log(typeof name);
      console.log(age);
      console.log(typeof age);
      console.log(active);
      console.log(typeof active);
      console.log(vote);
      console.log(typeof vote);
      console.log(contain);
      console.log(typeof contain);

      // abaixo, uma outra forma de mostrar os mesmos dados mostrados acima, mas em uma mesma linha de código.

      console.log(name, typeof name);
      console.log(age, typeof age);
      console.log(active, typeof active);
      console.log(vote, typeof vote);
      console.log(contain, typeof contain);
    </script>
  </body>
</html>

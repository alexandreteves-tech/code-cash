<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuação</title>
  </head>
  <body>
    <script>
      // ---------------- OPERADORES --------------------- //
      //***************************************************//
      //1. OPERADORES ARITMÉTICOS

      var valor1, valor2, total;
      valor1 = 5;
      valor2 = 2;
      total = valor1 + valor2;
      window.alert(total);

      // +, -, /, *
      // ++ gera um invremento no valor
      // ex: total = ++valor1, o resultado esperado para essa expressão é 6
      // -- gera um decremento no valor
      //ex: total = --valor1, o resultado esperado para essa expressão é 5

      //***************************************************//
      //2. OPERADORES DE ATRIBUIÇÃO

      // =,
      // +=, exemplo: valor1 = valor1 + valor2 pode ser usado valor1 +=valor2
      // igualmente usamos para +=, -=, *=, /=.

      //***************************************************//
      //3. OPERADORES DE SEQUÊNCIA

      //***************************************************//
      //4. OPERADORES DE COMPARAÇÃO
      // devolvem o resultado de true or false;
      // == se é igual
      // => igual ou maior, =< menor igual, === (se o valor é o mesmo e se o tipo é o mesmo (string, numeros etc.)), != diferente, !== (verifica se valores e tipos são diferentes.)

      //***************************************************//
      //5. OPERAÇÃO CONDICIONAL (TERNÁRIO)
      // Uma condição para uma variávelna hora de declarar ela.

      var idade, eleitor;

      idade = 18;
      eleitor = idade < 18 ? "Não, Eleitor" : "sim, eleitor";

      alert("A resposta é: " + eleitor + " a idade dele é de: " + idade);

      //***************************************************//
      //6. OPERADORES LÓGICOS
    </script>
  </body>
</html>
